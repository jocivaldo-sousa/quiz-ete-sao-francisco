<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <!-- Ajuste crucial para mobile: bloqueia o zoom automático para dar sensação de aplicativo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Meta tags para iOS (iPhone) e Android (Web App Capable) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quiz ETE">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2563eb"> <!-- Cor azul do topo -->

    <title>Quiz Interativo ETE - Avaliação de Operadores</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e Babel para processar o componente no navegador -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.4s ease-out forwards; }

        /* Ajustes Mobile: Evita seleção de texto e caixas de seleção nativas ao tocar na tela */
        body {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        /* Estilos específicos para Impressão / Salvar em PDF */
        @media print {
            body { background: white !important; padding: 0 !important; }
            #root > div { background: white !important; padding: 0 !important; display: block !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; border: 2px solid #2563eb !important; padding: 20px !important; margin: 0 !important; width: 100% !important; }
            .shadow-2xl, .shadow-lg { shadow: none !important; box-shadow: none !important; }
            .border-blue-200 { border: 1px solid #d1d5db !important; }
        }
    </style>
</head>
<body class="bg-blue-50 text-blue-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Ícones Inline SVG ---
        const IconDroplet = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
        );
        const IconUser = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-500"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        );
        const IconCheck = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        );
        const IconX = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        );
        const IconLock = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-orange-500"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        );
        const IconPrinter = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        );

        const questionsData = [
            {
                question: "Qual nível de tratamento de esgoto tem como objetivo principal a remoção de matéria orgânica e, eventualmente, de nutrientes como nitrogênio e fósforo?",
                options: ["Preliminar", "Primário", "Secundário", "Terciário"],
                answer: "Secundário",
                explanation: "O tratamento secundário foca na remoção de matéria orgânica biodegradável e nutrientes."
            },
            {
                question: "Qual dispositivo localizado na parte superior interna do reator DAFA é responsável pela separação das fases sólido-líquido-gasoso e pela garantia do tempo de detenção celular?",
                options: ["Vertedouro retangular", "Calha Parshall", "Separador Trifásico", "Tubo de by-pass"],
                answer: "Separador Trifásico",
                explanation: "O separador trifásico garante o retorno do lodo e a separação do biogás e do efluente clarificado."
            },
            {
                question: "Segundo o POP 001, quais elementos visuais devem ser verificados no esgoto bruto para identificar anomalias no início do processo?",
                options: ["Apenas a velocidade do fluxo", "Presença de espuma, óleo, graxa ou corantes", "Presença de peixes", "Transparência total"],
                answer: "Presença de espuma, óleo, graxa ou corantes",
                explanation: "O monitoramento inicial serve para identificar fluidos que não sejam esgoto domiciliar típico."
            },
            {
                question: "Com que frequência a equipe de captação deve percorrer as Estações Elevatórias para realizar a limpeza do sistema de gradeamento?",
                options: ["Uma vez por semana", "A cada 24 horas", "Duas vezes ao dia (matutino e vespertino)", "Apenas quando houver entupimento"],
                answer: "Duas vezes ao dia (matutino e vespertino)",
                explanation: "A rotina estabelecida prevê duas visitas diárias para manutenção da retenção de materiais grosseiros."
            },
            {
                question: "Ao inspecionar a área externa de uma EEE, se for detectado um desvio (vazamento) indevido de esgoto, qual deve ser a primeira ação do operador?",
                options: ["Corrigir o desvio abrindo o registro ou stop-log", "Desligar o painel elétrico imediatamente", "Aguardar a equipe de manutenção preventiva", "Aumentar a vazão das bombas"],
                answer: "Corrigir o desvio abrindo o registro ou stop-log",
                explanation: "A primeira ação corretiva direta é normalizar o fluxo para evitar descargas indevidas no meio ambiente."
            },
            {
                question: "No processo de lodos ativados, o que representa o parâmetro F/M (Food/Microorganism)?",
                options: ["A quantidade de oxigênio por kg de lodo", "A proporção entre a carga orgânica alimentada e a massa de microrganismos no tanque", "O tempo de secagem do lodo", "A velocidade de rotação dos aeradores"],
                answer: "A proporção entre a carga orgânica alimentada e a massa de microrganismos no tanque",
                explanation: "Este parâmetro indica se há alimento suficiente para a biomassa existente ou se há sobrecarga."
            },
            {
                question: "Qual é o valor máximo permitido pela ABNT para a taxa de aplicação de sólidos em um adensador de lodo por gravidade?",
                options: ["50 kg SST/m²·d", "100 kg SST/m²·d", "150 kg SST/m²·d", "250 kg SST/m²·d"],
                answer: "150 kg SST/m²·d",
                explanation: "O manual cita a norma ABNT que limita a carga de sólidos para garantir a eficiência do adensamento."
            },
            {
                question: "Qual é a frequência média recomendada para o ciclo de descarga e secagem de lodo nos leitos da ETE SFS?",
                options: ["2 a 5 dias", "7 a 10 dias", "2 a 3 semanas", "1 a 2 meses"],
                answer: "2 a 3 semanas",
                explanation: "O tempo varia conforme a capacidade do reator e as condições climáticas para a desidratação."
            },
            {
                question: "Além de garantir a decantação, qual o objetivo de evitar o desenvolvimento de bactérias filamentosas no decantador?",
                options: ["Aumentar o consumo de energia", "Produzir mais biogás", "Evitar o intumescimento do lodo e a sua fuga para o corpo receptor", "Mudar a cor do efluente para verde"],
                answer: "Evitar o intumescimento do lodo e a sua fuga para o corpo receptor",
                explanation: "O controle de bactérias filamentosas é vital para evitar que o lodo 'flutue' e saia junto com a água tratada."
            },
            {
                question: "De acordo com os dados consolidados de 2017, qual foi a eficiência de remoção de DQO alcançada pela ETE São Francisco do Conde?",
                options: ["60,00%", "70,50%", "78,58%", "86,41%"],
                answer: "78,58%",
                explanation: "Enquanto a remoção de DBO foi de 86,41%, a de DQO atingiu a marca de 78,58% naquele período."
            }
        ];

        function App() {
            const [step, setStep] = useState('login'); // 'login', 'quiz', 'result', 'saved', 'locked'
            const [operatorName, setOperatorName] = useState('');
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [isAnswered, setIsAnswered] = useState(false);

            const handleStart = () => {
                if (operatorName.trim()) setStep('quiz');
            };

            const handleAnswer = (option) => {
                if (isAnswered) return;
                setSelectedOption(option);
                setIsAnswered(true);
                if (option === questionsData[currentQuestion].answer) {
                    setScore(score + 1);
                }
            };

            const handleNext = () => {
                if (currentQuestion < questionsData.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                    setSelectedOption(null);
                    setIsAnswered(false);
                } else {
                    setStep('result');
                }
            };

            const handleSave = () => {
                setStep('saved');
            };

            const handlePrint = () => {
                window.print();
            };

            const handleFinalClose = () => {
                setStep('locked');
            };

            const percentage = Math.round((score / questionsData.length) * 100);
            const currentDate = new Date().toLocaleDateString('pt-BR');
            const currentTime = new Date().toLocaleTimeString('pt-BR');

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden border border-blue-200">
                        
                        {/* Header - Escondido na impressão */}
                        <div className="bg-blue-600 p-6 text-white flex items-center gap-4 no-print">
                            <IconDroplet />
                            <div>
                                <h1 className="text-xl font-bold uppercase tracking-wide">ETE - S. F. do Conde</h1>
                                <p className="text-blue-100 text-xs">Sistema de Avaliação para Operadores - V1.1</p>
                            </div>
                        </div>

                        {/* Conteúdo Dinâmico */}
                        <div className="p-6 sm:p-8">
                            
                            {/* PASSO 1: LOGIN */}
                            {step === 'login' && (
                                <div className="text-center animate-fade-in no-print">
                                    <div className="flex justify-center mb-6"><IconUser /></div>
                                    <h2 className="text-2xl font-bold mb-2">Identificação do Operador</h2>
                                    <p className="text-blue-600 mb-8 text-sm">Insira o seu nome para iniciar a avaliação.</p>
                                    <input 
                                        type="text" 
                                        className="w-full p-4 border-2 border-blue-100 rounded-xl mb-6 text-center text-lg focus:border-orange-500 outline-none transition-all uppercase"
                                        placeholder="Nome Completo"
                                        value={operatorName}
                                        onChange={(e) => setOperatorName(e.target.value)}
                                    />
                                    <button 
                                        onClick={handleStart}
                                        disabled={!operatorName.trim()}
                                        className="w-full bg-orange-500 hover:bg-orange-600 disabled:bg-blue-100 disabled:text-blue-300 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-95 touch-manipulation"
                                    >
                                        INICIAR AVALIAÇÃO
                                    </button>
                                </div>
                            )}

                            {/* PASSO 2: QUIZ */}
                            {step === 'quiz' && (
                                <div className="animate-fade-in no-print">
                                    <div className="flex justify-between items-center mb-6 border-b pb-4 border-blue-50">
                                        <span className="text-xs font-bold text-blue-400 uppercase">Pergunta {currentQuestion + 1} / {questionsData.length}</span>
                                        <span className="text-xs font-bold text-blue-900 bg-blue-100 px-3 py-1 rounded-full uppercase truncate max-w-[150px]">{operatorName}</span>
                                    </div>
                                    <h3 className="text-lg sm:text-xl font-bold mb-8 leading-tight text-blue-950">
                                        {questionsData[currentQuestion].question}
                                    </h3>
                                    <div className="space-y-3">
                                        {questionsData[currentQuestion].options.map((opt, i) => {
                                            const isCorrect = opt === questionsData[currentQuestion].answer;
                                            const isSelected = selectedOption === opt;
                                            let style = "w-full text-left p-4 rounded-xl border-2 font-medium transition-all flex justify-between items-center touch-manipulation text-sm sm:text-base ";
                                            
                                            if (!isAnswered) {
                                                style += "border-blue-100 hover:border-orange-400 hover:bg-orange-50";
                                            } else {
                                                if (isCorrect) style += "border-green-500 bg-green-50 text-green-800";
                                                else if (isSelected) style += "border-orange-500 bg-orange-50 text-orange-800";
                                                else style += "border-gray-100 text-gray-400 opacity-50";
                                            }

                                            return (
                                                <button key={i} onClick={() => handleAnswer(opt)} className={style} disabled={isAnswered}>
                                                    <span className="flex-1">{opt}</span>
                                                    {isAnswered && isCorrect && <span className="text-green-600 ml-2"><IconCheck /></span>}
                                                    {isAnswered && isSelected && !isCorrect && <span className="text-orange-600 ml-2"><IconX /></span>}
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {isAnswered && (
                                        <div className="mt-8 animate-fade-in">
                                            <div className={`p-4 rounded-xl mb-6 text-sm ${selectedOption === questionsData[currentQuestion].answer ? 'bg-green-100 text-green-900' : 'bg-orange-100 text-orange-900'}`}>
                                                <strong>Explicação:</strong> {questionsData[currentQuestion].explanation}
                                            </div>
                                            <button onClick={handleNext} className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition-all shadow-md touch-manipulation active:scale-95">
                                                {currentQuestion === questionsData.length - 1 ? "VER RESULTADO" : "PRÓXIMA PERGUNTA"}
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* PASSO 3: RESULTADO */}
                            {step === 'result' && (
                                <div className="text-center animate-fade-in no-print">
                                    <h2 className="text-2xl sm:text-3xl font-bold text-blue-900 mb-6">Resultado Final</h2>
                                    <div className="bg-blue-50 p-6 rounded-2xl mb-8 border border-blue-100">
                                        <p className="text-blue-600 uppercase text-xs font-bold mb-1">Operador Avaliado</p>
                                        <p className="text-lg sm:text-xl font-black text-blue-900 mb-4 uppercase break-words">{operatorName}</p>
                                        <div className="text-4xl sm:text-5xl font-black text-orange-500 mb-2">{percentage}%</div>
                                        <p className="text-blue-800 font-medium text-sm sm:text-base">Acertou {score} de {questionsData.length} questões</p>
                                    </div>
                                    <button 
                                        onClick={handleSave}
                                        className="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-xl transition-all shadow-lg text-base sm:text-lg flex items-center justify-center gap-2 touch-manipulation active:scale-95"
                                    >
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                                        SALVAR RESULTADO
                                    </button>
                                </div>
                            )}

                            {/* PASSO 4: SUCESSO E RESUMO PARA ENVIO / IMPRESSÃO */}
                            {step === 'saved' && (
                                <div className="animate-fade-in">
                                    <div className="text-center mb-8 no-print">
                                        <div className="text-green-500 flex justify-center mb-4">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                                        </div>
                                        <h2 className="text-xl sm:text-2xl font-bold text-blue-900">Avaliação Gravada!</h2>
                                        <p className="text-blue-600 text-sm">Comprovante de conclusão gerado abaixo.</p>
                                    </div>

                                    {/* Este bloco será o foco da impressão */}
                                    <div className="bg-white border-2 border-dashed border-blue-200 p-4 sm:p-6 rounded-xl mb-8 print-only">
                                        <div className="flex flex-col sm:flex-row sm:justify-between border-b border-blue-50 pb-2 mb-4 gap-1">
                                            <span className="text-xs font-bold text-blue-400">RECIBO DE TREINAMENTO</span>
                                            <span className="text-xs text-blue-400">{currentDate} - {currentTime}</span>
                                        </div>
                                        <div className="space-y-4 text-left">
                                            <div>
                                                <label className="text-[10px] text-blue-400 font-bold block uppercase">Operador</label>
                                                <p className="text-base sm:text-lg font-bold text-blue-900 uppercase">{operatorName}</p>
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="text-[10px] text-blue-400 font-bold block uppercase">Pontuação</label>
                                                    <p className="text-base sm:text-lg font-bold text-blue-900">{score} / {questionsData.length}</p>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-blue-400 font-bold block uppercase">Aproveitamento</label>
                                                    <p className="text-base sm:text-lg font-bold text-orange-600">{percentage}%</p>
                                                </div>
                                            </div>
                                            <div className="pt-4 border-t border-blue-50">
                                                <p className="text-[10px] text-center text-blue-300 italic">Versão 1.1 - Desenvolvido por Jocivaldo Sousa</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-3 no-print">
                                        <button 
                                            onClick={handlePrint}
                                            className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg uppercase tracking-wider flex items-center justify-center gap-2 text-sm sm:text-base touch-manipulation active:scale-95"
                                        >
                                            <IconPrinter />
                                            SALVAR / IMPRIMIR (PDF)
                                        </button>
                                        
                                        <button 
                                            onClick={handleFinalClose}
                                            className="w-full bg-blue-900 hover:bg-black text-white font-bold py-4 rounded-xl transition-all shadow-lg uppercase tracking-widest text-sm sm:text-base touch-manipulation active:scale-95"
                                        >
                                            ENCERRAR
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* PASSO 5: BLOQUEIO DEFINITIVO */}
                            {step === 'locked' && (
                                <div className="text-center py-12 animate-fade-in no-print">
                                    <div className="flex justify-center mb-6"><IconLock /></div>
                                    <h2 className="text-xl sm:text-2xl font-bold text-blue-950 mb-4">Sessão Finalizada</h2>
                                    <p className="text-blue-600 mb-2 text-sm sm:text-base">O teste do operador <strong>{operatorName}</strong> foi concluído.</p>
                                    <p className="text-blue-400 text-xs sm:text-sm italic mt-4">Para fazer uma nova avaliação, atualize a página.</p>
                                </div>
                            )}

                        </div>
                        
                        {/* Footer informativo - Escondido na impressão */}
                        <div className="bg-gray-50 p-4 text-center text-[10px] text-gray-400 uppercase tracking-widest border-t border-gray-100 no-print">
                            ETE - By Jocivaldo Sousa.
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
